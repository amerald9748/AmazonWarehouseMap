<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>佳邮国际拾谷-重点仓库分布图</title>
  <meta name="description" content="交互式亚马逊加拿大 FBA 仓点与自营仓地图：搜索、点聚合、3D 视角、仓库详情与周边距离，数据来自 Excel。" />
  <meta name="theme-color" content="#f1f5f9" />
  <script>
    // 尽早应用主题，避免刷新时闪烁。默认浅色；用户切换后的选择保存在浏览器里。
    (function () {
      var DEFAULT_THEME = 'light'; // 'light' | 'dark'
      var t = DEFAULT_THEME;
      try { t = localStorage.getItem('wh-theme') || t; } catch (e) {}
      t = t === 'dark' ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
      document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'dark' ? '#020617' : '#f1f5f9');
    })();
  </script>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.16.0/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/theme-light.css" />

  <!-- Tailwind CSS v4（浏览器构建，免编译） -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
  <style type="text/tailwindcss">
    @theme {
      --font-sans: "Inter", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
    }
  </style>

  <!-- 依赖版本集中在这里：MapLibre GL JS v6（仅 ESM）+ SheetJS -->
  <script type="importmap">
    {
      "imports": {
        "maplibre-gl": "https://cdn.jsdelivr.net/npm/maplibre-gl@6.16.0/dist/maplibre-gl.mjs",
        "xlsx": "https://cdn.sheetjs.com/xlsx-0.20.3/package/xlsx.mjs"
      }
    }
  </script>
  <script type="module" src="js/main.js"></script>
</head>

<body class="relative h-screen w-screen overflow-hidden bg-slate-950 font-sans text-slate-100 antialiased selection:bg-sky-400/30">
  <!-- 地图画布 -->
  <div id="map" class="absolute inset-0" role="region" aria-label="仓点地图"></div>
  <div class="wh-vignette pointer-events-none absolute inset-0" aria-hidden="true"></div>

  <!-- 左侧玻璃面板 -->
  <aside id="panel" aria-label="仓点面板"
    class="wh-panel absolute inset-x-2 bottom-2 z-20 flex h-[58vh] flex-col overflow-hidden rounded-2xl border border-white/10 bg-slate-900/80 text-white shadow-2xl shadow-black/50 backdrop-blur-md md:inset-x-auto md:bottom-4 md:left-4 md:top-4 md:h-auto md:w-[408px]">
    <header class="shrink-0 px-5 pb-3 pt-4 md:pt-5">
      <div class="flex items-center gap-3">
        <div class="grid size-10 shrink-0 place-items-center rounded-xl bg-gradient-to-br from-amber-300 to-orange-500 text-slate-950 shadow-lg shadow-orange-500/25">
          <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 8.35V20a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8.35A2 2 0 0 1 3.26 6.5l8-3.2a2 2 0 0 1 1.48 0l8 3.2A2 2 0 0 1 22 8.35Z"/><path d="M6 18h12"/><path d="M6 14h12"/><rect width="12" height="12" x="6" y="10"/></svg>
        </div>
        <div class="min-w-0 flex-1">
          <h1 class="truncate text-[15px] font-semibold tracking-tight text-white" title="佳邮国际拾谷-重点仓库分布图">佳邮国际拾谷-重点仓库分布图</h1>
          <p id="data-status" class="mt-0.5 flex items-center gap-1.5 text-xs text-slate-400" aria-live="polite"></p>
        </div>
        <button id="theme-toggle" type="button" class="wh-icon-btn !size-9" title="切换深色 / 浅色模式" aria-label="切换深色 / 浅色模式">
          <svg class="wh-theme-sun size-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
          <svg class="wh-theme-moon size-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
        <button id="panel-toggle" type="button" class="wh-icon-btn !size-9" title="收起 / 展开面板" aria-label="收起 / 展开面板" aria-expanded="true" aria-controls="panel">
          <svg class="size-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>
        </button>
      </div>

      <div id="kind-tabs" class="wh-kind mt-4" role="tablist" aria-label="仓库类型"></div>

      <div id="kpis" class="mt-3 grid grid-cols-4 gap-2"></div>

      <div class="wh-search relative mt-3">
        <svg class="pointer-events-none absolute left-3 top-1/2 size-4 -translate-y-1/2 text-slate-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="search" type="text" inputmode="search" autocomplete="off" spellcheck="false"
          placeholder="搜索编码、名称、城市、地址或邮编…" aria-label="搜索仓库"
          class="w-full rounded-xl border border-white/10 bg-white/[0.04] py-2.5 pl-9 pr-16 text-sm text-white outline-none transition placeholder:text-slate-500 focus:border-sky-400/50 focus:bg-white/[0.07] focus:ring-4 focus:ring-sky-400/10" />
        <button id="search-clear" type="button" hidden class="wh-icon-btn absolute right-9 top-1/2 -translate-y-1/2" aria-label="清除搜索">
          <svg class="size-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
        <kbd class="pointer-events-none absolute right-3 top-1/2 hidden -translate-y-1/2 rounded-md border border-white/10 bg-white/5 px-1.5 font-mono text-[10px] text-slate-400 md:block">/</kbd>
      </div>

      <div id="chips" class="wh-no-scrollbar -mx-5 mt-3 flex gap-1.5 overflow-x-auto px-5" aria-label="按省份筛选"></div>
    </header>

    <div id="panel-body" class="relative min-h-0 flex-1 border-t border-white/[0.06]">
      <section id="list-view" class="wh-view absolute inset-0 flex flex-col">
        <div class="flex items-center justify-between px-5 pb-1.5 pt-2.5 text-[11.5px] text-slate-400">
          <span id="result-count"></span>
          <span class="hidden items-center gap-1 text-slate-500 md:flex"><kbd class="wh-kbd">↑</kbd><kbd class="wh-kbd">↓</kbd> 选择 <kbd class="wh-kbd">Enter</kbd> 打开</span>
        </div>
        <div id="list" class="wh-scroll min-h-0 flex-1 overflow-y-auto px-2.5 pb-3" role="listbox" aria-label="仓点列表">
          <div class="space-y-2 px-2.5 pt-2" aria-hidden="true">
            <div class="wh-skeleton h-14"></div><div class="wh-skeleton h-14"></div><div class="wh-skeleton h-14"></div><div class="wh-skeleton h-14"></div>
          </div>
        </div>
      </section>
      <section id="detail-view" class="wh-view absolute inset-0 flex flex-col pt-3" aria-live="polite"></section>
    </div>

    <footer class="wh-footer flex shrink-0 items-center gap-3 border-t border-white/[0.06] px-5 py-2.5 text-[11.5px] text-slate-400">
      <span id="source-label" class="flex min-w-0 flex-1 items-center gap-1.5"></span>
      <button id="import-btn" type="button" class="wh-ghost-btn shrink-0 !text-slate-300" title="导入新的 Excel（也可直接拖拽到页面）">
        <svg class="size-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></svg>
        导入 Excel
      </button>
    </footer>
  </aside>

  <!-- 面板收起后的展开按钮（桌面端） -->
  <button id="panel-open" type="button" class="wh-panel-open" aria-label="展开仓点面板" title="展开仓点面板">
    <svg class="size-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>
    <span>仓点列表</span>
  </button>

  <!-- 图例 -->
  <div id="legend" hidden class="wh-legend absolute bottom-12 right-4 z-10 hidden w-56 rounded-xl border border-white/10 bg-slate-900/75 p-3.5 shadow-xl shadow-black/40 backdrop-blur-md md:block"></div>

  <!-- 提示 -->
  <div id="toasts" class="pointer-events-none fixed left-1/2 top-4 z-50 flex w-[min(92vw,420px)] -translate-x-1/2 flex-col items-center gap-2 md:bottom-6 md:top-auto" aria-live="polite"></div>

  <!-- 拖拽导入 -->
  <div id="dropzone" class="wh-dropzone" aria-hidden="true">
    <div class="rounded-2xl border-2 border-dashed border-sky-300/50 bg-slate-900/80 px-10 py-8 text-center shadow-2xl backdrop-blur-md">
      <p class="text-base font-semibold text-white">松开以导入 Excel</p>
      <p class="mt-1 text-xs text-slate-400">仅在浏览器本地解析，不会上传到任何服务器</p>
    </div>
  </div>

  <input id="file-input" type="file" accept=".xlsx,.xlsm,.xls,.csv" hidden />

  <!-- 启动加载层 -->
  <div id="loader" class="wh-loader">
    <div class="flex flex-col items-center gap-5 px-6 text-center">
      <div class="wh-loader__ring"></div>
      <p class="text-sm font-medium tracking-wide text-slate-300">正在加载仓点地图…</p>
      <p id="loader-hint" class="max-w-sm text-xs leading-relaxed text-slate-500"></p>
    </div>
  </div>
  <script>
    // 在 ES 模块无法运行的情况（例如直接双击打开 HTML）下给出提示
    (function () {
      var hint = document.getElementById('loader-hint');
      if (location.protocol === 'file:') {
        hint.innerHTML = '检测到通过 file:// 打开。浏览器禁止此方式加载模块与 Excel，请在项目目录运行<br><code class="text-slate-300">python -m http.server 5173</code><br>然后访问 http://localhost:5173';
        return;
      }
      setTimeout(function () {
        if (document.getElementById('loader')) hint.textContent = '加载时间较长，请检查网络是否可以访问 cdn.jsdelivr.net、cdn.sheetjs.com 与地图瓦片服务。';
      }, 15000);
    })();
  </script>
</body>
</html>
